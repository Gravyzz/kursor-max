name: CI

# На каждый push в любую ветку (зелёная отметка есть у каждого коммита, в том числе у сдаваемого),
# на каждый pull request и вручную из вкладки Actions.
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Сервер — типы и тесты
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: handbook_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/server/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - name: Модульные и интеграционные тесты
        run: npm test
        env:
          TEST_DATABASE_URL: postgres://postgres:test@localhost:5432/handbook_test

  miniapp:
    name: Мини-приложение — сборка
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/miniapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  demo:
    name: Браузерное демо — проверка и сборка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Зависимости сервера, мини-приложения и демо
        run: |
          npm ci --no-audit --no-fund --prefix apps/server
          npm ci --no-audit --no-fund --prefix apps/miniapp
          npm ci --no-audit --no-fund --prefix apps/demo
      - name: Сценарий демо на PGlite (тот же код сервера)
        run: npm run smoke --prefix apps/demo
      - name: Сборка страницы демо
        run: npm run build --prefix apps/demo
      - name: Браузер для сквозного теста
        working-directory: apps/demo
        run: npx playwright install --with-deps chromium
      - name: Сквозной сценарий из README в браузере
        run: npm run e2e --prefix apps/demo
      - name: Скриншоты шагов сценария
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/demo/test/e2e-output/
          if-no-files-found: ignore

  docker:
    name: Docker — compose, образы и офлайн-стенд
    # Основной путь жюри — docker compose up --build -d: проверяем его так же, как это сделает человек
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Версии Docker
        run: docker version && docker compose version
      - name: compose.yaml — локальный профиль
        run: docker compose config -q
      - name: compose.prod.yaml — продакшн-профиль с фиктивными значениями
        run: |
          # Без секретов продакшн-профиль обязан отказаться запускаться
          if docker compose --env-file .env.production.example config -q 2>/dev/null; then
            echo "::error::Продакшн-профиль принял пустые BOT_TOKEN, WEBHOOK_SECRET, APP_SECRET и POSTGRES_PASSWORD"
            exit 1
          fi
          sed -e 's/^BOT_TOKEN=.*/BOT_TOKEN=ci-fake-token/' \
              -e 's/^WEBHOOK_SECRET=.*/WEBHOOK_SECRET=ci_fake_webhook_secret/' \
              -e 's/^APP_SECRET=.*/APP_SECRET=ci-fake-app-secret-0123456789/' \
              -e 's/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=cifakepassword/' \
              -e 's/^RATE_LIMIT_PER_MINUTE=.*/RATE_LIMIT_PER_MINUTE=123/' \
              -e 's|^TRUST_PROXY=.*|TRUST_PROXY=loopback,10.0.0.0/8|' \
              .env.production.example > "$RUNNER_TEMP/prod.env"
          docker compose --env-file "$RUNNER_TEMP/prod.env" config -q
          docker compose --env-file "$RUNNER_TEMP/prod.env" config --format json > "$RUNNER_TEMP/prod.json"
          # Настройки из .env доходят до контейнеров, имитация MAX не запускается, наружу — 80 и 443
          jq -e '.services.api.environment | .NODE_ENV == "production" and .DEV_AUTH == "false" and .RATE_LIMIT_PER_MINUTE == "123" and .TRUST_PROXY == "loopback,10.0.0.0/8"' "$RUNNER_TEMP/prod.json"
          jq -e '(.services | has("max-mock") | not) and ([.services.web.ports[].published] | index("443") != null)' "$RUNNER_TEMP/prod.json"
      - name: Каждая переменная config.ts доходит до контейнеров и описана в примерах .env
        run: |
          docker compose config --format json > "$RUNNER_TEMP/local.json"
          missing=0
          for key in $(grep -oE '^  [A-Z][A-Z0-9_]+:' apps/server/src/config.ts | tr -d ' :'); do
            # API_HOST внутри контейнера всегда 0.0.0.0 (значение по умолчанию)
            [ "$key" = API_HOST ] && continue
            if ! jq -e --arg k "$key" '.services.api.environment | has($k)' "$RUNNER_TEMP/local.json" > /dev/null; then
              echo "::error file=compose.yaml::$key из config.ts не передаётся в контейнеры — добавьте в x-server-env"
              missing=1
            fi
            # Складываются из других переменных или зафиксированы в compose.yaml (на них опирается Caddyfile)
            case "$key" in DATABASE_URL|WEBHOOK_PATH|API_PORT|BOT_PORT) continue ;; esac
            for file in .env.example .env.production.example; do
              if ! grep -q "^$key=" "$file"; then
                echo "::error file=$file::$key из config.ts не описана в $file"
                missing=1
              fi
            done
          done
          exit $missing
      - name: Сборка образов
        run: docker compose build
      - name: Запуск офлайн-стенда
        run: docker compose up -d
      - name: Стенд отвечает
        run: |
          curl -fsS --retry 30 --retry-delay 3 --retry-all-errors http://localhost:8080/api/health
          echo
          curl -fsS http://localhost:8080/ | grep '<div id="root">' > /dev/null
          curl -fsS http://localhost:9090/__mock/ | grep 'имитация MAX' > /dev/null
          docker compose ps -a
      - name: Бот отвечает в имитации MAX
        run: |
          curl -fsS -X POST http://localhost:9090/__mock/start -H 'content-type: application/json' -d '{"user_id":100500,"payload":"demo"}'
          echo
          for attempt in $(seq 1 30); do
            if curl -fsS 'http://localhost:9090/__mock/messages?user_id=100500' | jq -e '[.messages[] | select(.direction == "out")] | length > 0' > /dev/null; then
              curl -fsS 'http://localhost:9090/__mock/messages?user_id=100500' | jq -r '.messages[] | select(.direction == "out") | .text'
              exit 0
            fi
            sleep 2
          done
          echo "::error::Бот не ответил на /start demo за минуту"
          exit 1
      - name: Журналы контейнеров
        if: failure()
        run: docker compose ps -a && docker compose logs --no-color
      - name: Остановить стенд
        if: always()
        run: docker compose down -v
